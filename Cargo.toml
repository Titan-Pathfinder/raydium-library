[workspace]
members = ["libraries", "client"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = ">=0.9.0,<4", features = ["no-entrypoint"] }
spl-associated-token-account = { version = ">=2.2.0", features = [
  "no-entrypoint",
] }
solana-client = "1.17"
solana-sdk = "1.17"
