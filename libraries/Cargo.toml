[package]
name = "raydium-library"
version = "0.3.0"
edition.workspace = true

[dependencies]
anchor-client = ">=0.29.0,<1"
anchor-lang = ">=0.29.0,<1"
serum_dex = { version = "0.5.10", git = "https://github.com/raydium-io/openbook-dex", default-features = false, features = [
  "client",
] }
raydium_amm = { git = "https://github.com/Titan-Pathfinder/raydium-amm.git", default-features = false, features = [
  "client",
] }
spl-token.workspace = true
spl-associated-token-account.workspace = true
spl-token-2022.workspace = true
spl-memo = ">=4.0.0"
solana-program = "1.17"
solana-client.workspace = true
solana-sdk.workspace = true
solana-account-decoder = "1.17"
solana-transaction-status = "1.17"
anyhow = "1.0.53"
rand = "0.8.5"
bytemuck = { version = "1.7.3" }
safe-transmute = "0.11.2"
serde_json = { version = "1.0.78" }
serde = { version = "1.0", features = ["derive"] }
base64 = "0.21"
bs58 = ">=0.4.0,<1"
bincode = { version = "1.3.3" }
debug_print = "1.0.0"
arrayref = "0.3.6"
uint = "0.9.5"

[lib]
crate-type = ["cdylib", "lib"]
